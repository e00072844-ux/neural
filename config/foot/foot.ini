# foot con el estilo NEURAL//DECK
# Los colores los escribe el fondo (app.py) en neural-colores.ini con el tema
# activo; las ventanas NUEVAS de foot toman el tema que este puesto.
[main]
font=Share Tech Mono:size=12, DejaVu Sans Mono:size=11
pad=12x10
include=~/.config/foot/neural-colores.ini

[cursor]
style=block
blink=yes

[scrollback]
lines=5000

[mouse]
hide-when-typing=yes
