# Wayfire mínimo para NEURAL//LOGIN (lo lanza greetd como usuario «greeter»)
[core]
plugins = autostart
xwayland = false
preferred_decoration_mode = client

[autostart]
autostart_wf_shell = false
neural_login = python3 /usr/local/share/neural-greeter/neural-greeter.py > /var/lib/greetd/neural-greeter.log 2>&1
