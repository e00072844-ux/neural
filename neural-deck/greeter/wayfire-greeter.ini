# Wayfire mínimo para NEURAL//LOGIN (lo lanza /usr/local/bin/neural-login como usuario «greeter»)
[core]
plugins = autostart command
xwayland = false
preferred_decoration_mode = client

[autostart]
autostart_wf_shell = false
# al salir el greeter (bien o mal) se cierra este Wayfire; neural-login decide si
# arrancó la sesión o si hay que pasar a tuigreet. Sin esto, un greeter caído = pantalla negra.
neural_login = sh -c 'python3 /usr/local/share/neural-greeter/neural-greeter.py > /var/lib/greetd/neural-greeter.log 2>&1; pkill -x -u greeter wayfire'

[command]
# escape si NEURAL//LOGIN se congela: cierra este Wayfire → tuigreet
binding_tui = <ctrl> <alt> KEY_BACKSPACE
command_tui = pkill -x -u greeter wayfire
